# Blueprint de Render — backend de TradInc (API Express).
# El frontend se despliega en Netlify (ver netlify.toml).
services:
  - type: web
    name: tradinc-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Orígenes permitidos por CORS, separados por coma.
      # Se define en el dashboard de Render con la URL real de Netlify.
      - key: CORS_ORIGINS
        sync: false
